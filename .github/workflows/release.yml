name: build and release

# Quoted: bare `on` is the boolean true in YAML 1.1, which trips up local linters.
"on":
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the release job can publish a release.
permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build catalog snapshot
        # Pulls the index and directory listings once and compacts them to ~4.5 MB, which the
        # publish steps below embed. Best effort: if the mirrors are unreachable from the runner
        # no snapshot ships, and the app falls back to fetching the index itself.
        continue-on-error: true
        run: |
          dotnet run --project Steam2Browser/Steam2Browser.csproj -c Release \
            -- --build-index Steam2Browser/index.bin --with-sizes

      - name: Report snapshot
        run: |
          if [ -f Steam2Browser/index.bin ]; then
            mb=$(du -m Steam2Browser/index.bin | cut -f1)
            echo "embedding a catalog snapshot of ${mb} MB"
          else
            echo 'no snapshot — the app will fetch the index on first run'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: index-bin
          path: Steam2Browser/index.bin
          if-no-files-found: ignore

  build-macos:
    needs: build-index
    runs-on: macos-latest # arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: index-bin
          path: Steam2Browser
        continue-on-error: true

      - name: Publish
        # EnableCompressionInSingleFile is deliberately left off here: with it on, the published
        # binary hit an intermittent System.IO.IOException / AccessViolationException under
        # concurrent requests on .NET 10.0.400 osx-arm64 (crashed 2/2 fresh-process burst tests
        # with compression on, survived 6+ with it off). Revisit once a newer .NET 10 patch ships.
        run: |
          dotnet publish Steam2Browser/Steam2Browser.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -p:BuildCommitSha=${{ github.sha }} \
            -o publish

      - name: Trim publish leftovers
        # The UI and the depot key table are embedded in the binary, so the loose copies
        # ASP.NET emits are dead weight.
        run: |
          rm -rf publish/wwwroot
          rm -f publish/*.staticwebassets.endpoints.json
          ls -la publish

      - name: Smoke test
        # Catches a build that publishes but cannot start — the embedded UI failing to
        # resolve would otherwise only show up on a user's machine. Also fires a burst of
        # concurrent requests: an intermittent AccessViolationException under concurrent
        # connections (single-file bundle related, see the Publish step) only ever showed up
        # under load, never on a single sequential request. Every curl is capped with -m so a
        # hung connection bounds itself; timeout-minutes below is a second-layer backstop.
        #
        # Bare `wait` waits for every background job in the shell, not just the curls just
        # launched — including the still-running server itself, since it's also backgrounded.
        # That deadlocks (wait never returns because the server never exits, and the server is
        # only killed after wait returns) so each round's curl PIDs are tracked and waited on
        # explicitly instead.
        timeout-minutes: 5
        run: |
          chmod +x publish/steam2browser
          ./publish/steam2browser --no-browser --port=5099 &
          pid=$!
          ok=false
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS -m 5 http://127.0.0.1:5099/ 2>/dev/null | grep -q 'Steam2 Archive'; then
              ok=true
              break
            fi
          done
          if [ "$ok" = true ]; then
            for round in 1 2 3; do
              curl_pids=()
              for i in $(seq 1 30); do
                curl -s -m 5 http://127.0.0.1:5099/ -o /dev/null & curl_pids+=($!)
                curl -s -m 5 http://127.0.0.1:5099/api/state -o /dev/null & curl_pids+=($!)
                curl -s -m 5 "http://127.0.0.1:5099/api/depots?take=20" -o /dev/null & curl_pids+=($!)
              done
              wait "${curl_pids[@]}"
              if ! kill -0 $pid 2>/dev/null; then
                ok=false
                echo "binary crashed under concurrent load (round $round)" >&2
                break
              fi
            done
          fi
          kill $pid 2>/dev/null || true
          if [ "$ok" != true ]; then
            echo 'the published binary did not serve its UI' >&2
            exit 1
          fi
          echo 'served the UI'

      - name: Package
        # The zip stays a raw binary (for CLI flags like --port); the dmg gets a real .app bundle
        # so double-clicking it in Finder does something, instead of just opening a folder of
        # loose files with no obvious way to run them.
        run: |
          cp README.md publish/
          (cd publish && zip -r -y ../steam2browser-osx-arm64.zip .)

          app="dmgroot/Steam2 Archive Browser.app"
          mkdir -p "$app/Contents/MacOS"
          cp publish/steam2browser "$app/Contents/MacOS/steam2browser"
          chmod +x "$app/Contents/MacOS/steam2browser"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp README.md dmgroot/
          ln -s /Applications dmgroot/Applications

          # dotnet's arm64 publish already leaves an ad-hoc signature on the raw binary; wrapping
          # it in a bundle without resealing the whole thing left Gatekeeper's assessment of
          # Info.plist/Resources inconsistent with that inner signature. Confirmed hands-on: an
          # unsealed bundle downloaded with a real quarantine flag shows Finder's *unrecoverable*
          # "is damaged and can't be opened" dialog (no right-click override) rather than the
          # normal "unidentified developer" one. Re-signing the whole bundle ad-hoc after assembly
          # reseals it correctly and restores the normal (overridable) Gatekeeper prompt.
          codesign --force --deep --sign - "$app"

          hdiutil create -volname "Steam2 Archive Browser" -srcfolder dmgroot -ov -format UDZO \
            steam2browser-osx-arm64.dmg
          ls -la steam2browser-osx-arm64.zip steam2browser-osx-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: release-osx-arm64
          path: |
            steam2browser-osx-arm64.zip
            steam2browser-osx-arm64.dmg

  release:
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      # `gh release create` shells out to git to resolve repo context; without a checkout there's
      # no .git directory and it fails with "not a git repository".
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The app checks for updates by comparing its build stamp against the newest commit
        # time on main, so every push to main gets a build that carries that commit's date.
        run: |
          tag="v1.0.${{ github.run_number }}"
          sha="$(echo ${{ github.sha }} | cut -c1-7)"
          notes="Built from commit ${sha}.

          macOS (Apple Silicon): download \`steam2browser-osx-arm64.dmg\`, drag the app into
          Applications, right-click it and choose Open (it is unsigned, so Gatekeeper blocks a
          plain double-click the first time). Or grab the \`.zip\` for the raw binary instead.

          Self-contained: no .NET install needed. Data lives in
          \`~/Library/Application Support/steam2info/\`."

          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes "$notes" \
            --target "${{ github.sha }}"
